{% extends "base.html" %}
{% block title %}Sign in · Shopify Image Matcher{% endblock %}
{% block content %}
<section class="login-card card">
  <p class="eyebrow">PRIVATE UPLOADER</p>
  <h1>Sign in</h1>
  <p class="lead">Enter the uploader password to access the Shopify catalogue and media tools.</p>
  {% if error %}<div class="notice error">{{ error }}</div>{% endif %}
  <form method="post" action="{{ url_for('login') }}">
    <label>Password<input name="password" type="password" autocomplete="current-password" required autofocus></label>
    <button type="submit">Continue</button>
  </form>
</section>
{% endblock %}
